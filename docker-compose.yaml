services:
  db:
    image: docker.io/postgres:18
    container_name: neosrc-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-neosrc_user1}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-welikeneosrc1}
      POSTGRES_MULTIPLE_DATABASES: ${POSTGRES_MULTIPLE_DATABASES:-neosrc,e2e_test,functional_test}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./dev/init-docker-database.sh:/docker-entrypoint-initdb.d/init-docker-database.sh:ro
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-neosrc}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
