[default]
extend-ignore-re = [
    # Esy package manager lock directory (e.g. "foo.esy.lock")
    "\\.esy\\.",
    # Intentional invalid Forgejo qualifier in tests ("mis:closed")
    "mis:",
]

[default.extend-identifiers]
# betterAuth table prefix
ba_user = "ba_user"
ba_session = "ba_session"
ba_account = "ba_account"
ba_verification = "ba_verification"
ba_session_userId_idx = "ba_session_userId_idx"
ba_account_userId_idx = "ba_account_userId_idx"

[default.extend-words]
# Esy package manager (https://esy.sh)
esy = "esy"
# Part of "hello" split by code block markers in test
hel = "hel"

[files]
extend-exclude = ["drizzle/**/*", "api-specs/**/*", "src/components/markdown/code-language-map.ts"]
